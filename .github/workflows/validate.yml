name: Validate dataset
on: [push, pull_request]
permissions:
  contents: read
jobs:
  dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_release.py
      - run: python -m unittest discover -s tests -v
